<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JBS バックギャモン配信用オーバーレイ編集画面">
  <title>配信盤面作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23383838'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23cf2933' stroke='%23cfb064' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261005-membersort1">
</head>
<body>
  <div class="app">
    <aside class="control-panel">
      <div class="top-actions">
        <label class="channel-picker" for="channelSelect">
          <select id="channelSelect" aria-label="編集する配信">
            <option value="1">配信1</option>
            <option value="2">配信2</option>
          </select>
        </label>
        <button class="open-output" id="openOutput">配信本番</button>
        <span class="action-separator" aria-hidden="true"></span>
        <button class="settings-action" id="loadSettings" type="button">設定呼出</button>
        <button class="settings-action" id="importJson" type="button">JSON取込</button>
        <input id="importJsonFile" type="file" accept="application/json,.json" hidden>
        <span class="action-separator" aria-hidden="true"></span>
        <button class="settings-action" id="saveSettings" type="button">設定保存</button>
        <button class="settings-action" id="exportJson" type="button">JSON出力</button>
        <button class="settings-action" id="exportPng" type="button">PNG書出</button>
      </div>
      <div class="display-toggles">
        <label class="sponsor-toggle" for="english"><input type="checkbox" id="english" data-field="english"><span>英語</span></label>
        <label class="sponsor-toggle" for="personal"><input type="checkbox" id="personal" data-field="personal"><span>選手映像</span></label>
        <label class="sponsor-toggle" for="playerPhoto"><input type="checkbox" id="playerPhoto" data-field="playerPhoto"><span>選手写真</span></label>
        <label class="sponsor-toggle" for="guide"><input type="checkbox" id="guide" data-field="guide"><span>ガイド</span></label>
        <label class="sponsor-toggle" for="video"><input type="checkbox" id="video" data-field="video"><span>映像</span></label>
        <label class="sponsor-toggle" for="sponsors"><input type="checkbox" id="sponsors" data-field="sponsors"><span>広告</span></label>
        <label class="sponsor-toggle" for="sponsors2"><input type="checkbox" id="sponsors2" data-field="sponsors2"><span>広告2</span></label>
        <label class="sponsor-toggle" for="rules"><input type="checkbox" id="rules" data-field="rules"><span>ルール</span></label>
      </div>

      <div class="event-fields">
        <div class="field"><label for="edition">回次等</label><input id="edition" data-field="edition"><input class="english-input" id="editionEn" data-field="editionEn" placeholder="English" hidden></div>
        <div class="field">
          <label for="title">大会名</label>
          <div class="preset-input">
            <select id="titlePreset" data-preset-for="title" aria-label="大会名のプリセット">
              <option value="">選択</option>
              <option>日本選手権</option><option>盤聖戦</option><option>名人戦</option><option>王位戦</option>
              <option>賽王戦</option><option>棋聖戦</option><option>女王戦</option><option>新鋭戦</option>
              <option>東京オープン</option><option>大阪オープン</option><option>名古屋オープン</option>
            </select>
            <input id="title" data-field="title">
          </div>
          <input class="english-input" id="titleEn" data-field="titleEn" placeholder="English" hidden>
        </div>
        <div class="field">
          <label for="round">試合名</label>
          <div class="preset-input">
            <select id="roundPreset" data-preset-for="round" aria-label="試合名のプリセット">
              <option value="">選択</option>
              <option>決勝</option><option>準決勝</option><option>準々決勝</option><option>プレーオフ</option>
              <option>１回戦</option><option>２回戦</option><option>３回戦</option>
            </select>
            <input id="round" data-field="round">
          </div>
          <input class="english-input" id="roundEn" data-field="roundEn" placeholder="English" hidden>
        </div>
        <div class="field"><label for="topName">上選手名</label><div class="preset-input player-input"><select id="topMember" data-member-for="top" aria-label="上選手名の選択"><option value="">選択</option></select><input id="topName" data-field="topName"></div><input class="english-input" id="topNameEn" data-field="topNameEn" placeholder="English" hidden></div>
        <div class="field"><label for="bottomName">下選手名</label><div class="preset-input player-input"><select id="bottomMember" data-member-for="bottom" aria-label="下選手名の選択"><option value="">選択</option></select><input id="bottomName" data-field="bottomName"></div><input class="english-input" id="bottomNameEn" data-field="bottomNameEn" placeholder="English" hidden></div>
      </div>

      <div class="guide-fields" hidden>
        <div class="field"><label for="guideVerticalGap">縦・選手エリアとの間隔</label><input type="number" id="guideVerticalGap" data-field="guideVerticalGap" min="0" max="400" step="1"></div>
        <div class="field"><label for="guideStart12">横・12開始</label><input type="number" id="guideStart12" data-field="guideStart12" min="0" max="1920" step="1"></div>
        <div class="field"><label for="guideStart6">横・6開始</label><input type="number" id="guideStart6" data-field="guideStart6" min="0" max="1920" step="1"></div>
        <div class="field"><label for="guideGoalStart">横・ゴール開始</label><input type="number" id="guideGoalStart" data-field="guideGoalStart" min="0" max="1920" step="1"></div>
        <div class="field"><label for="guidePointGap">横・マス間の間隔</label><input type="number" id="guidePointGap" data-field="guidePointGap" min="20" max="160" step="1"></div>
      </div>

      <div class="color-row">
        <div class="field"><label for="frameColorText">テーマカラー</label><div class="color-control"><input type="color" id="frameColor" data-color-for="frameColor"><input id="frameColorText" class="hex-input" data-field="frameColor" maxlength="7" spellcheck="false"></div></div>
        <div class="field">
          <label for="panelMode">パネルカラー</label>
          <div class="panel-color-control">
            <select id="panelMode" data-field="panelMode" aria-label="パネルカラーの種類">
              <option value="gradient">金グラデ</option>
              <option value="solid">単色</option>
            </select>
            <input type="color" id="panelColor" data-color-for="panelColor">
            <input id="panelColorText" class="hex-input" data-field="panelColor" maxlength="7" spellcheck="false">
          </div>
        </div>
        <div class="field"><label for="topColorText">上選手カラー</label><div class="color-control"><input type="color" id="topColor" data-color-for="topColor"><input id="topColorText" class="hex-input" data-field="topColor" maxlength="7" spellcheck="false"></div></div>
        <div class="swap-field"><button type="button" id="swapPlayerColors" class="swap-colors"><span>上下</span><span>入替</span></button></div>
        <div class="field"><label for="bottomColorText">下選手カラー</label><div class="color-control"><input type="color" id="bottomColor" data-color-for="bottomColor"><input id="bottomColorText" class="hex-input" data-field="bottomColor" maxlength="7" spellcheck="false"></div></div>
        <div class="field">
          <label for="boardPreset">ボード</label>
          <div class="board-control">
            <select id="boardPreset" data-board-preset>
              <option value="">選択</option>
              <option value="japan">日本選手権</option>
              <option value="bansei">盤聖戦</option>
              <option value="meijin">名人戦</option>
              <option value="oui">王位戦</option>
              <option value="saiou">賽王戦</option>
              <option value="kishino">来住野</option>
            </select>
          </div>
        </div>
      </div>

    </aside>

    <section class="stage-shell" id="stageMount" aria-label="配信画面プレビュー"></section>
  </div>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsDialogTitle">
    <div class="settings-dialog-head">
      <h2 id="settingsDialogTitle">保存した設定</h2>
      <button type="button" id="closeSettings" class="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="saved-settings" id="savedSettings"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    fetch('stage.html?v=20261005-transparent').then(r => r.text()).then(html => {
      document.getElementById('stageMount').innerHTML = html;
      const script = document.createElement('script');
      script.src = 'overlay.js?v=20261005-membersort1';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
