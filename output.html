<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <meta name="description" content="JBS バックギャモン配信用オーバーレイ出力">
  <title>JBS Overlay Output</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- All JBS tools use the same favicon and Apple touch icon as the official tools home. -->
  <link rel="icon" href="https://jbsbackgammon.github.io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://jbsbackgammon.github.io/favicon-32x32.png">

<body class="output-page">
  <main id="stageMount"></main>
  <!-- Common defines JBSBrand; its data are fetched separately with a fallback. -->
  <script src="https://jbsbackgammon.github.io/common/brand.js"></script>
  <script>
    fetch('stage.html?v=20261021-panel-right2-v6').then(r => r.text()).then(html => {
      document.getElementById('stageMount').innerHTML = html;
      const script = document.createElement('script');
      script.src = 'overlay.js?v=20261021-panel-metals-v10';
      document.body.appendChild(script);
    });
  </script>
</body>
