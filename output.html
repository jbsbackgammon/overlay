<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <meta name="description" content="JBS バックギャモン配信用オーバーレイ出力">
  <title>JBS Overlay Output</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- All JBS tools use the same favicon and Apple touch icon as the official tools home. -->
  <link rel="icon" href="https://jbsbackgammon.github.io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://jbsbackgammon.github.io/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://jbsbackgammon.github.io/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="output-page">
  <main id="stageMount"></main>
  <!-- Common defines JBSBrand; its data are fetched separately with a fallback. -->
  <script src="https://jbsbackgammon.github.io/common/brand.js?v=10"></script>
  <script src="https://jbsbackgammon.github.io/common/members.js?v=2"></script>
  <script src="snapshot.js"></script>
  <script>
    (async () => {
      const packed = new URLSearchParams(location.search).get('z');
      if (packed) {
        try {
          // Decode before loading overlay.js: it reads the snapshot at startup.
          window.__jbsCompressedSnapshot = await JBSOutputSnapshot.decode(packed);
        } catch (error) {
          console.error('配信URLの設定を復元できませんでした。', error);
          document.getElementById('stageMount').textContent =
            '配信URLの設定を読み込めませんでした。配信盤面作成からURLを再取得してください。';
          return;
        }
      }
      try {
        const response = await fetch('stage.html');
        if (!response.ok) throw new Error('Stage template unavailable');
        document.getElementById('stageMount').innerHTML = await response.text();
        const script = document.createElement('script');
        script.src = 'overlay.js';
        document.body.appendChild(script);
      } catch (error) {
        console.error('配信盤面を読み込めませんでした。', error);
      }
    })();
  </script>
</body>
</html>
